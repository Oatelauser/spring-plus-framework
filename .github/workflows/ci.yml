name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B clean install

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  # OWASP 依赖 CVE 扫描：观察期仅报告不拦截（failBuildOnCVSS=11 等效不拦截），
  # NVD 数据首次下载较慢；稳定后改为 failBuildOnCVSS=7 收紧门禁
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: OWASP dependency-check
        run: >
          mvn -B org.owasp:dependency-check-maven:12.1.0:check
          -DfailBuildOnCVSS=11
          || true

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 14
