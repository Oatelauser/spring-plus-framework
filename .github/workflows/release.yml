name: Release to Maven Central

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 导入签名私钥（本仓库发布密钥为免口令密钥，导入即可用；
      # 若未来换带口令密钥，需追加 GPG_PASSPHRASE secret 并在 gpg 与 maven 两侧使用 loopback）
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format long

      # 用占位符从 Secrets 渲染 runner 本地的 settings.xml（不在仓库存任何明文）
      - name: Generate settings.xml from secrets
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <servers>
              <server>
                <id>central</id>
                <username>${CENTRAL_USERNAME}</username>
                <password>${CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      # tag 名去掉 v 前缀回填全模块 pom 版本（versions:set 联动所有 <parent><version>）。
      # pom 平时停在 SNAPSHOT 不必手动 bump——Central 不收 SNAPSHOT，打什么 tag 就发什么版本
      - name: Set release version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing version: ${VERSION}"
          mvn -B org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
            -DnewVersion="${VERSION}" -DgenerateBackupPoms=false

      - name: Build, sign and deploy
        run: mvn -B -P release deploy

      - name: Upload deploy log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-deploy-log
          path: |
            **/target/central-publishing/**
          retention-days: 7
